<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chance Lock</title>

  <style>
    :root {
      --card: rgba(18, 18, 18, 0.94);
      --card-2: #0d0d0d;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f4f4f4;
      --muted: #9a9a9a;
      --locked: #ffffff;
      --shadow: rgba(0, 0, 0, 0.72);
      --glow: rgba(255, 255, 255, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.13), transparent 28%),
        radial-gradient(circle at 50% 82%, rgba(255, 255, 255, 0.055), transparent 34%),
        linear-gradient(135deg, #000000, #111111 52%, #050505);
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 26px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.055;
      background-image:
        linear-gradient(90deg, #ffffff 1px, transparent 1px),
        linear-gradient(#ffffff 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
    }

    .card {
      width: min(94vw, 820px);
      position: relative;
      z-index: 1;
      text-align: center;
      padding: clamp(24px, 4vw, 38px);
      border-radius: 30px;
      border: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025)),
        var(--card);
      box-shadow:
        0 34px 100px var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
    }

    .badge {
      width: fit-content;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.055);
      color: var(--muted);
      font-size: 13px;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.65);
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 64px);
      line-height: 0.95;
      letter-spacing: -2px;
      font-weight: 900;
    }

    .subtitle {
      width: min(100%, 600px);
      margin: 16px auto 26px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .display {
      padding: clamp(18px, 3vw, 28px);
      border-radius: 24px;
      border: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.018)),
        var(--card-2);
      box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.58);
    }

    .roll-section + .roll-section {
      margin-top: 26px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.09);
    }

    .label {
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      margin-bottom: 12px;
    }

    .digit-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(5px, 1vw, 10px);
      flex-wrap: wrap;
      min-height: 78px;
    }

    .digits {
      display: flex;
      justify-content: center;
      gap: clamp(5px, 1vw, 10px);
      flex-wrap: wrap;
    }

    .digit {
      width: clamp(34px, 6.3vw, 56px);
      height: clamp(52px, 8.4vw, 74px);
      display: grid;
      place-items: center;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: linear-gradient(180deg, #222222, #080808);
      color: #bebebe;
      font-size: clamp(28px, 5.4vw, 48px);
      font-weight: 950;
      font-variant-numeric: tabular-nums;
      position: relative;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        0 12px 28px rgba(0, 0, 0, 0.45);
      transition:
        transform 180ms ease,
        color 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease,
        background 180ms ease;
    }

    .digit::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      top: 50%;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .digit.spinning {
      animation: digit-shake 90ms linear infinite;
    }

    .digit.locked {
      color: var(--locked);
      border-color: rgba(255, 255, 255, 0.44);
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.18), transparent 45%),
        linear-gradient(180deg, #2c2c2c, #101010);
      box-shadow:
        0 0 26px var(--glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        0 12px 30px rgba(0, 0, 0, 0.48);
      transform: translateY(-2px) scale(1.04);
    }

    @keyframes digit-shake {
      0% { transform: translateY(-1px); }
      50% { transform: translateY(1px); }
      100% { transform: translateY(-1px); }
    }

    .button-stack {
      width: min(100%, 320px);
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 26px auto 0;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 15px 24px;
      cursor: pointer;
      color: #050505;
      background: linear-gradient(180deg, #ffffff, #adadad);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.2px;
      box-shadow:
        0 14px 38px rgba(255, 255, 255, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
      transition:
        transform 160ms ease,
        filter 160ms ease,
        opacity 160ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.58;
      cursor: not-allowed;
      transform: none;
    }

    .ghost-button {
      color: var(--text);
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .source-pill {
      width: fit-content;
      max-width: 100%;
      margin: 14px auto 0;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.095);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .footer-note {
      margin-top: 20px;
      color: #767676;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 620px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 22px 15px;
      }
    }
  </style>
</head>

    <section class="display" aria-live="polite">
      <div class="roll-section">
        <div class="label">1-in-1,000,000 Roll</div>

        <div class="digit-line">
          <div id="mainDigits" class="digits"></div>
        </div>
      </div>

      <div class="roll-section">
        <div class="label">Decimal Roll / 100,000</div>

        <div class="digit-line">
          <div id="decimalDigits" class="digits"></div>
        </div>
      </div>
    </section>

    <div class="button-stack">
      <button id="generateButton" type="button">RNG</button>
      <button id="instantButton" class="ghost-button" type="button">Instant Result</button>
    </div>

    <div id="sourceStatus" class="source-pill">Source: ready</div>
  </main>

  <script>
    const mainDigitsContainer = document.getElementById("mainDigits");
    const decimalDigitsContainer = document.getElementById("decimalDigits");
    const generateButton = document.getElementById("generateButton");
    const instantButton = document.getElementById("instantButton");
    const sourceStatus = document.getElementById("sourceStatus");

    const MAIN_DIGIT_COUNT = 7;
    const DECIMAL_DIGIT_COUNT = 5;

    const MAIN_MIN = 1;
    const MAIN_MAX = 1000000;

    const DECIMAL_MIN = 1;
    const DECIMAL_MAX = 99999;

    const MAIN_LOCK_DELAY_START = 1400;
    const LOCK_DELAY_STEP = 390;
    const DECIMAL_START_AFTER_MAIN = LOCK_DELAY_STEP;
    const SPIN_INTERVAL = 45;

    const FIRST_LOCK_FREQUENCY = 420;
    const LOCK_FREQUENCY_STEP = 42;

    let mainDigitElements = [];
    let decimalDigitElements = [];
    let spinTimers = [];
    let lockTimers = [];
    let isRunning = false;

    let audioContext = null;

    function setupAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        return;
      }

      if (!audioContext) {
        audioContext = new AudioContextClass();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    function playTone(frequency, duration, volume, type) {
      if (!audioContext) {
        return;
      }

      const now = audioContext.currentTime;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, now);
      oscillator.frequency.exponentialRampToValueAtTime(frequency * 0.78, now + duration);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(now);
      oscillator.stop(now + duration + 0.03);
    }

    function playLockSound(section, index) {
      const soundIndex = section === "decimal" ? MAIN_DIGIT_COUNT + index : index;
      const frequency = FIRST_LOCK_FREQUENCY + soundIndex * LOCK_FREQUENCY_STEP;

      playTone(frequency, 0.09, 0.13, "triangle");
      setTimeout(() => {
        playTone(frequency * 1.5, 0.055, 0.055, "sine");
      }, 22);
    }

    function playButtonSound() {
      playTone(260, 0.06, 0.08, "sine");
    }

    function playFinishedSound() {
      const finalFrequency = FIRST_LOCK_FREQUENCY + (MAIN_DIGIT_COUNT + DECIMAL_DIGIT_COUNT) * LOCK_FREQUENCY_STEP;
      playTone(finalFrequency, 0.1, 0.09, "triangle");
      setTimeout(() => playTone(finalFrequency + 140, 0.12, 0.075, "sine"), 80);
    }

    function offlineRandomInt(min, max) {
      const range = max - min + 1;

      if (window.crypto && window.crypto.getRandomValues) {
        const maxUint = 0xffffffff;
        const limit = Math.floor(maxUint / range) * range;
        const buffer = new Uint32Array(1);

        do {
          window.crypto.getRandomValues(buffer);
        } while (buffer[0] >= limit);

        return min + (buffer[0] % range);
      }

      return Math.floor(Math.random() * range) + min;
    }

    function withTimeout(promise, milliseconds) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          reject(new Error("Request timed out"));
        }, milliseconds);

        promise
          .then((value) => {
            clearTimeout(timer);
            resolve(value);
          })
          .catch((error) => {
            clearTimeout(timer);
            reject(error);
          });
      });
    }

    async function fetchRandomOrgInt(min, max) {
      const url =
        "https://www.random.org/integers/?num=1" +
        "&min=" + encodeURIComponent(min) +
        "&max=" + encodeURIComponent(max) +
        "&col=1&base=10&format=plain&rnd=new";

      const response = await withTimeout(fetch(url, { cache: "no-store" }), 3500);

      if (!response.ok) {
        throw new Error("Random.org request failed");
      }

      const text = await response.text();
      const value = Number.parseInt(text.trim(), 10);

      if (!Number.isInteger(value) || value < min || value > max) {
        throw new Error("Random.org returned an invalid value");
      }

      return value;
    }

    async function getRngValues() {
      if (!navigator.onLine) {
        sourceStatus.textContent = "Source: offline crypto RNG";
        return {
          mainNumber: offlineRandomInt(MAIN_MIN, MAIN_MAX),
          decimalNumber: offlineRandomInt(DECIMAL_MIN, DECIMAL_MAX)
        };
      }

      sourceStatus.textContent = "Source: trying Random.org...";

      try {
        const mainNumber = await fetchRandomOrgInt(MAIN_MIN, MAIN_MAX);
        const decimalNumber = await fetchRandomOrgInt(DECIMAL_MIN, DECIMAL_MAX);

        sourceStatus.textContent = "Source: Random.org";
        return {
          mainNumber,
          decimalNumber
        };
      } catch (error) {
        sourceStatus.textContent = "Source: offline crypto RNG fallback";
        return {
          mainNumber: offlineRandomInt(MAIN_MIN, MAIN_MAX),
          decimalNumber: offlineRandomInt(DECIMAL_MIN, DECIMAL_MAX)
        };
      }
    }

    function toDigits(number, digitCount) {
      return String(number).padStart(digitCount, "0").split("");
    }

    function clearAllTimers() {
      spinTimers.forEach(clearInterval);
      lockTimers.forEach(clearTimeout);

      spinTimers = [];
      lockTimers = [];
    }

    function buildDigitSet(container, count, startValue) {
      container.innerHTML = "";

      const elements = [];

      for (let i = 0; i < count; i++) {
        const digit = document.createElement("div");
        digit.className = "digit";
        digit.textContent = startValue;
        container.appendChild(digit);
        elements.push(digit);
      }

      return elements;
    }

    function resetDigits() {
      mainDigitElements = buildDigitSet(mainDigitsContainer, MAIN_DIGIT_COUNT, "0");
      decimalDigitElements = buildDigitSet(decimalDigitsContainer, DECIMAL_DIGIT_COUNT, "0");
    }

    function setButtonsDisabled(disabled) {
      generateButton.disabled = disabled;
      instantButton.disabled = disabled;
    }

    function startSpinning(elements) {
      elements.forEach((digit, index) => {
        digit.classList.remove("locked");
        digit.classList.add("spinning");

        const timer = setInterval(() => {
          digit.textContent = String(offlineRandomInt(1, 9));
        }, SPIN_INTERVAL + index * 4);

        digit.spinTimer = timer;
        spinTimers.push(timer);
      });
    }

    function lockDigitSet(elements, finalDigits, section, startDelay, onComplete) {
      let lockedCount = 0;

      finalDigits.forEach((finalDigit, index) => {
        const timer = setTimeout(() => {
          const digit = elements[index];

          if (digit.spinTimer) {
            clearInterval(digit.spinTimer);
          }

          digit.textContent = finalDigit;
          digit.classList.remove("spinning");
          digit.classList.add("locked");

          playLockSound(section, index);

          lockedCount++;

          if (lockedCount === finalDigits.length && typeof onComplete === "function") {
            onComplete();
          }
        }, startDelay + index * LOCK_DELAY_STEP);

        lockTimers.push(timer);
      });
    }

    function finishGeneration() {
      playFinishedSound();
      isRunning = false;
      setButtonsDisabled(false);
    }

    async function generateWithAnimation() {
      if (isRunning) return;

      setupAudio();
      playButtonSound();

      isRunning = true;
      clearAllTimers();
      setButtonsDisabled(true);

      resetDigits();

      startSpinning(mainDigitElements);
      startSpinning(decimalDigitElements);

      const rngValues = await getRngValues();

      const mainFinalDigits = toDigits(rngValues.mainNumber, MAIN_DIGIT_COUNT);
      const decimalFinalDigits = toDigits(rngValues.decimalNumber, DECIMAL_DIGIT_COUNT);

      lockDigitSet(mainDigitElements, mainFinalDigits, "main", MAIN_LOCK_DELAY_START, function () {
        lockDigitSet(decimalDigitElements, decimalFinalDigits, "decimal", DECIMAL_START_AFTER_MAIN, finishGeneration);
      });
    }

    async function generateInstant() {
      setupAudio();
      playButtonSound();

      if (isRunning) {
        clearAllTimers();
        isRunning = false;
      }

      setButtonsDisabled(true);
      resetDigits();

      const rngValues = await getRngValues();

      const mainFinalDigits = toDigits(rngValues.mainNumber, MAIN_DIGIT_COUNT);
      const decimalFinalDigits = toDigits(rngValues.decimalNumber, DECIMAL_DIGIT_COUNT);

      mainFinalDigits.forEach((digitValue, index) => {
        mainDigitElements[index].textContent = digitValue;
        mainDigitElements[index].classList.add("locked");
      });

      decimalFinalDigits.forEach((digitValue, index) => {
        decimalDigitElements[index].textContent = digitValue;
        decimalDigitElements[index].classList.add("locked");
      });

      playFinishedSound();
      setButtonsDisabled(false);
    }

    generateButton.addEventListener("click", generateWithAnimation);
    instantButton.addEventListener("click", generateInstant);

    window.addEventListener("online", () => {
      sourceStatus.textContent = "Source: ready, online";
    });

    window.addEventListener("offline", () => {
      sourceStatus.textContent = "Source: offline crypto RNG";
    });

    resetDigits();

    sourceStatus.textContent = navigator.onLine
      ? "Source: ready, online"
      : "Source: offline crypto RNG";
  </script>
</body>
</html>
